name: Build private APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private debug signing key
        env:
          KEY: ${{ secrets.MINT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEY" | base64 --decode > ~/.android/debug.keystore
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MintPlayer-installable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
